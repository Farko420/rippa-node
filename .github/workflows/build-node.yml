name: build-node

# Every push to main compiles the portable .exe and publishes it to a rolling
# "latest" release. The fleet's Master polls this release hourly and rolls the
# whole swarm forward automatically — no operator action anywhere.
on:
  push:
    # The repo's default branch is currently `master`; `main` is kept so the
    # workflow still fires if the default is ever renamed. Without both, a push
    # produces no build and OTA has nothing to publish.
    branches: [main, master]
  # Allows a manual re-run (e.g. after fixing a failed build) from the UI.
  workflow_dispatch:
  # Also run when a version is manually edited in package.json.
  release:
    types: [published]

permissions:
  # Explicit, not implicit: the default GITHUB_TOKEN permissions depend on the
  # repo/org settings, so a release job can fail with a confusing 403 when
  # `contents: write` is not requested up front. State both explicitly.
  contents: write # required to create/update a release, its assets and the tag
  packages: write # required if the exe is ever mirrored to a GitHub Package

# A newer push to main always wins; never cancel a release upload midway,
# because that can leave a release pointing at a partial asset.
concurrency:
  group: build-node-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build rippa-node.exe and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci is preferred over npm install for reproducibility, but it fails
      # without a lockfile in sync; fall back so the build is never blocked.
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm ci failed - falling back to npm install"
            npm install
          }

      # Bump the patch version so the fleet's isVersionNewer() comparison sees a
      # genuinely newer release on every push. The bumped version is committed
      # back so package.json stays the single source of truth for the app.
      - name: Bump version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $parts = $pkg.version.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2] + 1
          $newVersion = "$major.$minor.$patch"
          npm version $newVersion --no-git-tag-version --allow-same-version
          $pkg.version = $newVersion
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
          Write-Host "Building version $newVersion"
          "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Build the portable .exe
        shell: pwsh
        run: npm run package

      # Resolve the built binary ONCE, dynamically, and reuse it for the size
      # check, the checksum and (implicitly) the release. Hardcoding
      # dist\rippa-node.exe in three places meant a single change to
      # scripts/package.mjs broke the build at three different points. This
      # searches the same directories the upload glob covers.
      - name: Locate and verify the artifact
        id: exe
        shell: pwsh
        run: |
          $found = @()
          foreach ($dir in @('dist', 'build', '.')) {
            if (Test-Path $dir) {
              $found += Get-ChildItem -Path $dir -Filter *.exe -File -ErrorAction SilentlyContinue
            }
          }
          if ($found.Count -eq 0) {
            Write-Error "npm run package produced no .exe in dist/, build/ or the repo root"
            exit 1
          }
          $exe = $found | Sort-Object Length -Descending | Select-Object -First 1
          $size = $exe.Length
          Write-Host ("Artifact: {0}" -f $exe.FullName)
          Write-Host ("Artifact size: {0:N1} MB" -f ($size / 1MB))
          if ($size -lt 1MB) {
            Write-Error "Artifact is implausibly small - refusing to publish"
            exit 1
          }
          # Relative, forward-slashed: feeds straight into glob paths and the
          # release `files` list without Windows separators confusing them.
          "path=$($exe.FullName.Replace($PWD.Path + '\', '').Replace('\', '/'))" >> $env:GITHUB_OUTPUT

      # Ship the checksum with the release so the updater can verify the binary
      # it downloads instead of trusting size + PE magic alone.
      - name: Compute SHA-256
        id: checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ steps.exe.outputs.path }}" -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Commit the version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ steps.version.outputs.version }}"
          file_pattern: package.json

      # -------------------------------------------------------------------------
      # RELEASE TAG RESOLUTION
      #
      # A release can only be created against a commitish that actually exists.
      # On an ordinary push to `master`, `github.ref_name` is the BRANCH name,
      # not a tag, so using it as a tag target is what makes release creation
      # fail on every commit that is not itself a tagged release. Resolve an
      # explicit, always-valid target instead:
      #   - tag-triggered run  -> the real git tag;
      #   - branch commit      -> the pushed SHA (never fails), with a stable
      #                          fallback tag v1.0.<run_number> recorded for
      #                          provenance and used as the release target name.
      # -------------------------------------------------------------------------
      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $commitish = "${{ github.sha }}"
          } else {
            $tag = "v1.0.${{ github.run_number }}"
            # The SHA is always resolvable, which is the entire point: it removes
            # the "release creation failed because master is not a tag" failure.
            $commitish = "${{ github.sha }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commitish=$commitish" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag (commitish: $commitish)"

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          # Rolling tag: always points at the newest build. The fleet's Master
          # polls /releases/latest, so this tag must stay stable across pushes.
          tag_name: latest
          # What the release/tag is created from. Never a branch name.
          target_commitish: ${{ steps.release_tag.outputs.commitish }}
          name: rippa-node ${{ steps.version.outputs.version }}
          prerelease: false
          draft: false
          # Auto-generated notes are NOT enabled: they get prepended to `body`
          # and can change shape between runs. The updater parses the version and
          # SHA-256 out of this body, so it must stay byte-stable.
          generate_release_notes: false
          body: |
            Automated build of `rippa-node.exe`.

            rippa-node-version: `${{ steps.version.outputs.version }}`
            SHA-256: `${{ steps.checksum.outputs.sha256 }}`
            build-tag: `${{ steps.release_tag.outputs.tag }}`

            The Master node polls this release hourly and broadcasts the update to
            every paired satellite automatically.
          files: |
            dist/*.exe
            build/*.exe
            *.exe
          # Not `true`: with wildcards, a renamed or relocated binary makes the
          # glob match nothing, and a hard failure here would abort the job
          # before the artifact safety-net upload below can run. The release
          # body already carries the version + SHA for provenance, so a miss
          # must not cost us the release.
          fail_on_unmatched_files: false
        env:
          # Passed explicitly. The action falls back to `github.token`, but the
          # implicit value depends on the repository's default token permissions,
          # so state it to make the 403-on-release impossible to misdiagnose.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # DIAGNOSTIC. `npm run package` writes dist/rippa-node.exe (see
      # scripts/package.mjs), but when packaging fails upstream the upload step
      # below reports the misleading "No files were found with the provided
      # path" — because it has `if: always()`, it runs even after the real step
      # already failed, hiding the actual error. Dumping the tree makes the true
      # cause (empty dist/, missing build/, exe under a different name) visible
      # in the log. bash, not pwsh: this job's default shell is PowerShell,
      # where `ls -la` is not valid syntax; Git Bash ships on windows-latest.
      - name: List build outputs
        shell: bash
        run: |
          ls -la
          ls -la dist || true
          ls -la build || true

      # The release is a distribution channel; the artifact is the safety net.
      # `if: always()` is deliberate: a failed or skipped release publish must
      # never cost us the built exe, which is expensive to rebuild and is the
      # only copy of that exact build.
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rippa-node-exe
          # Glob rather than the literal dist/rippa-node.exe: any *.exe the
          # packager emits is still the artifact we want, even if the output
          # path in scripts/package.mjs is ever changed.
          path: |
            dist/*.exe
            build/*.exe
            *.exe
          # `warn`, not `error`: the exe build is the expensive, irreplaceable
          # output. A path mismatch is a packaging bug to fix in the next
          # commit — it must not terminate the rest of the workflow.
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # ANDROID APK — the mobile satellite.
  #
  # A SEPARATE JOB, not a matrix row, and that is deliberate on three counts:
  #   - it runs on ubuntu-latest with the Android SDK, while the .exe job needs
  #     windows-latest with `pkg`. One matrix would force both onto a runner that
  #     suits neither;
  #   - it has NO `needs:` on build-and-release, so the two run concurrently.
  #     The .exe job is the fleet's OTA path and must never be gated on a tablet
  #     pipeline (nor vice versa); decoupling also means an artifact/upload
  #     glitch in either job cannot block or mask the other. The APK's own steps
  #     still `if: always()` their uploads, so a failed Gradle build still
  #     surfaces as a failure here without touching the .exe release;
  #   - the APK is attached to the SAME rolling release, so a tablet operator
  #     downloads it from the same place as everything else.
  # ---------------------------------------------------------------------------
  build-apk:
    name: Build rippa-node.apk
    runs-on: ubuntu-latest
    # Deliberately independent of build-and-release: runs in parallel with it.
    # softprops/action-gh-release is idempotent against the existing `latest`
    # tag (it appends assets rather than recreating the release), so both jobs
    # targeting the same rolling release is safe.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 17 is what Capacitor 6 targets; Gradle 8 / AGP 8.2 need a JDK at or
      # above it, and the build fails cryptically on 11.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Gradle's own cache. Without it every build downloads the full Android
      # toolchain and dependencies from scratch, taking most of the job's time.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ runner.os }}-${{ hashFiles('mobile/android/**/build.gradle') }}
          restore-keys: |
            gradle-apk-${{ runner.os }}-

      - name: Install node dependencies
        run: npm ci || npm install

      # The mobile worker is bundled and staged here; the script also generates
      # mobile/android/ and applies the manifest overlay before Gradle runs.
      - name: Build the APK
        run: node scripts/package-apk.mjs

      - name: Locate the APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find mobile/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Gradle produced no APK"
            exit 1
          fi
          SIZE=$(du -h "$APK" | cut -f1)
          echo "Found $APK ($SIZE)"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify the APK really contains our permissions and service
        run: |
          set -euo pipefail
          # Asserts the foreground-service configuration actually made it into
          # the binary. A silently-missing WAKE_LOCK is the exact failure that
          # makes a tablet stop at midnight, so it is worth failing the build over.
          AAPT=$(ls "${ANDROID_HOME}"/build-tools/*/aapt2 | head -n 1)
          DUMP="$("$AAPT" dump xmltree --file AndroidManifest.xml "${{ steps.apk.outputs.path }}" | tr -d '\r')"
          for NEEDLE in WAKE_LOCK FOREGROUND_SERVICE RippaNodeService; do
            if ! grep -q "$NEEDLE" <<<"$DUMP"; then
              echo "::error::APK manifest is missing $NEEDLE"
              exit 1
            fi
            echo "ok: $NEEDLE present"
          done

      # Same rolling release as the .exe, so an operator finds both in one place.
      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          # Same reason as the .exe job: the SHA always resolves, a branch name
          # does not. Without this the release can fail to be created on master.
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same safety net as the .exe: the APK survives a failed release publish.
      - name: Upload the APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rippa-node-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: warn
          retention-days: 30

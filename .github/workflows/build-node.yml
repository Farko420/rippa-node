name: build-node

# Every push to main compiles the portable .exe and publishes it to a versioned
# release tagged `v1.0.<run_number>` — the GitHub Action run number IS the
# version, so the local node, the GitHub Releases and the Mothership's OTA
# updater can never disagree. The fleet's Master polls /releases/latest (GitHub
# resolves it to the newest release by creation time) hourly and rolls the
# whole swarm forward automatically — no operator action anywhere.
on:
  push:
    # The repo's default branch is currently `master`; `main` is kept so the
    # workflow still fires if the default is ever renamed. Without both, a push
    # produces no build and OTA has nothing to publish.
    branches: [main, master]
    # TAGS MATTER AS MUCH AS BRANCHES, and omitting them is what made "OTA aborts"
    # a mystery rather than a bug report.
    #
    # `git push origin v1.0.11` is how a release is cut, and with `branches:` only
    # it matched NO trigger at all: no build, no release, no OTA, and a green
    # Actions page because nothing ran. The fleet then sat on its old binary with
    # the updater logging a version it had already seen and nothing to fetch.
    #
    # A tag build and a branch build publish through the SAME run-numbered
    # release scheme (see the Publish step): every run mints `v1.0.<run_number>`,
    # and GitHub's `/releases/latest` returns the newest release by CREATED_AT —
    # runs create releases in ascending run order, so the newest build is always
    # the answer every node polls. The operator's own tag is still recorded in
    # the release body as `build-tag:` for provenance.
    #
    # `v*` only, and `v[0-9]+.*` would be stricter still; `v*` is chosen so a
    # typo'd tag fails the build loudly rather than silently matching nothing.
    tags: ["v*"]
  # Allows a manual re-run (e.g. after fixing a failed build) from the UI.
  workflow_dispatch:
  # Also run when a release is published from the GitHub UI.
  #
  # GUARDED, and the guard is load-bearing. This workflow publishes a release,
  # and publishing a release fires this trigger again. Releases are now minted
  # PER RUN (`v1.0.<run_number>`), so every publish creates a NEW release rather
  # than updating a fixed one — and a day when that re-trigger actually lands
  # would ship an infinite rebuild-and-republish loop. The `if:` below keys on
  # the release AUTHOR (`github-actions[bot]`), making the loop impossible by
  # construction rather than depending on which events GitHub chooses to
  # propagate from a GITHUB_TOKEN.
  release:
    types: [published]

permissions:
  # Explicit, not implicit: the default GITHUB_TOKEN permissions depend on the
  # repo/org settings, so a release job can fail with a confusing 403 when
  # `contents: write` is not requested up front. State both explicitly.
  contents: write # required to create/update a release, its assets and the tag
  packages: write # required if the exe is ever mirrored to a GitHub Package

# A newer push to main always wins; never cancel a release upload midway,
# because that can leave a release pointing at a partial asset.
concurrency:
  group: build-node-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build rippa-node.exe and publish release
    runs-on: windows-latest

    # -------------------------------------------------------------------------
    # THE HANG GUARD. This job once sat for 3+ hours on the pkg step "Fetching
    # base Node.js binaries to PKG_CACHE_PATH" and only ended when someone
    # cancelled it by hand.
    #
    # pkg's own fetch path has NO timeout: @yao-pkg/pkg-fetch's `downloadUrl`
    # awaits an `undici.fetch` that is never aborted, so a stalled TLS
    # connection or a proxy that accepts and never delivers parks the step
    # indefinitely rather than failing. With no job-level timeout the runner
    # is simply occupied until GitHub's 6-hour ceiling — which is exactly the
    # "burned 6 hours of runner time" failure.
    #
    # 15 minutes is comfortably above a healthy run (checkout + npm ci + tsc +
    # two pkg bundles + a ~100 MB binary fetch) and far below the point where
    # a stall costs anything worth protecting. Raising it to absorb a genuine
    # stall would only re-create the problem this exists to stop: if this job
    # ever needs more than 15 minutes, the fix is to find out why, not to widen
    # the window.
    #
    # Deliberately NOT applied to `build-apk`: that job runs a full Gradle
    # assemble plus bundling, which legitimately exceeds 15 minutes on a cold
    # cache. Timing it out would fail builds that are working correctly.
    # -------------------------------------------------------------------------
    timeout-minutes: 15

    # THE RELEASE LOOP GUARD, and it is an `if:` on the JOB rather than on the
    # publish step for one reason: the version-bump step COMMITS BACK to the
    # branch, and that push is itself a trigger. Guarding only the publish step
    # would still let a re-triggered run bump and commit a version again, so the
    # repo would gain an endless series of "chore: bump version" commits.
    #
    # This workflow's own releases are minted by the bot (see the Publish step),
    # so a `release` event authored by `github-actions[bot]` is this workflow
    # talking to itself. The tags are now per-run (v1.0.<run_number>), so a tag
    # name can no longer distinguish "ours" from "a human's" — the AUTHOR is the
    # only stable discriminator left. A human publishing any release still runs,
    # which is the case worth keeping.
    if: >-
      github.event_name != 'release' ||
      github.event.release.author.login != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Depth 0 is REQUIRED, not an optimisation. The version step commits
          # a new package.json back to the branch, and `stefanzweifel/git-auto-commit-action`
          # refuses to push without a usable ref to push onto — with the default
          # shallow fetch (depth 1) that ref is missing and the step fails with a
          # checkout error that reads nothing like its cause.
          fetch-depth: 0
          # Pin the checkout to the exact ref that triggered the run. Without an
          # explicit `ref`, checkout resolves the default branch tip, which on a
          # tag-triggered run is NOT the tag under build — the workspace can then
          # end up on a different tree than the one the workflow was launched for.
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # -------------------------------------------------------------------------
      # npm ci is preferred over npm install for reproducibility, but it fails
      # without a lockfile in sync; fall back so the build is never blocked.
      - name: Install dependencies
        run: |
          npm install better-sqlite3@11.3.0 --no-save
          npm install --no-package-lock

      # -------------------------------------------------------------------------
      # RUN-NUMBER VERSIONING — the version IS the action run number.
      #
      # `1.0.<github.run_number>` is written into package.json BEFORE anything
      # compiles, so the shipped rippa-node.exe inherently knows its exact
      # build: src/version.ts reads package.json with require() at module load
      # and pkg freezes that manifest into the binary's snapshot. The startup
      # banner, the /api/swarm/heartbeat payload and the OTA updater's
      # isVersionNewer() comparison all read that one value — which is what
      # removes the local / GitHub Release / Mothership version drift this epic
      # exists to fix, without a single hand-edited number in the chain.
      #
      # NOT a patch+1, and NOT the operator's tag either: the run number is
      # monotonic per workflow, so a version can never repeat, never needs a
      # manual bump, and every release can be traced back to the exact Actions
      # run that produced it. A tag push takes the SAME path — deriving the
      # version from the pushed tag would make the release tag
      # (v1.0.<run_number>) and the body (`rippa-node-version`) disagree, which
      # is the exact mismatch the epic removes (see `extractVersion` in
      # src/services/updater.ts: it reads the tag first, so the two must match).
      #
      # `--allow-same-version` is load-bearing for a re-run: GitHub re-runs
      # reuse the ORIGINAL run_number, and without the flag `npm version` fails
      # with "Version not changed" before a single line of code compiles.
      #
      # The set version is committed back so package.json stays the single
      # source of truth for local dev and for anything that reads the repo.
      - name: Set the run-number version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $previous = "$($pkg.version)"
          $newVersion = "1.0.${{ github.run_number }}"
          # The literal run-number stamp, exactly as the epic specifies: the
          # exe's snapshot must carry this exact value.
          npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::npm version 1.0.${{ github.run_number }} failed (exit $LASTEXITCODE); package.json was not stamped with the run number."
            exit 1
          }
          # A run_number at or below the fleet's current version would publish
          # a DOWNGRADE that the fleet's isVersionNewer() guard silently
          # refuses - a green run with an OTA that never moves, the exact
          # failure mode this pipeline exists to prevent. Warn loudly rather
          # than fail: the binary itself is still valid. (ASCII hyphen, not an
          # em-dash: a smart quote inside a PowerShell string literal breaks
          # the no-BOM ANSI parse this suite does on Windows PowerShell 5.1.)
          if ($previous -match '^\d+\.\d+\.\d+$' -and [version]$newVersion -le [version]$previous) {
            Write-Warning "Version $newVersion is not newer than $previous - the fleet's downgrade guard will refuse to OTA onto it."
          }
          Write-Host "Building version $newVersion (was: $previous)"
          "version=$newVersion" >> $env:GITHUB_OUTPUT

      # -------------------------------------------------------------------------
      # THE ENGINE REGRESSION SUITE — runs BEFORE anything is packaged.
      #
      # WHY IT MUST SIT HERE, NOT AFTER `npm run package`. `scripts/package.mjs`
      # step 5 PRUNES every `.js`/`.map` out of `dist/` once the .exe has been
      # frozen into it, because the packaged binary must not ship loose source.
      # After that step there is no compiled JavaScript left in dist/ to import,
      # so these suites would fail with a bare module-not-found — a failure that
      # reads like a broken test rather than a step in the wrong place. Hence:
      # build and test first, package second.
      #
      # WHAT IT COVERS. `test:engine` is the CLI allow-list/padlock checks, the
      # health probe against a fake Ollama, and the managed-port publish
      # (verify-managed-ollama-origin.mjs) asserting that the port this node BINDS
      # is the port it REPORTS — env.OLLAMA_URL, getStatus().port, getPort() and
      # the health badge must all resolve to the managed origin, not the 11434
      # default. That last case was invisible to CI until recently: the health
      # suite deliberately exercises the UNMANAGED path, so the managed publish
      # had NO coverage and a node could serve perfectly while reporting itself
      # OFFLINE to the Mothership and 502-ing every /v1/chat request.
      #
      # NO OLLAMA BINARY IS NEEDED. Every suite stands up its own fake HTTP
      # server; the managed-origin suite binds the real managed port 11435 to
      # that fake. So this step needs no model download and no GPU, and costs
      # seconds.
      #
      # FAILING HERE IS THE POINT. This gates the release: a regression stops the
      # build before it can publish a broken binary, rather than after the fleet
      # has already pulled it.
      #
      # `npm run test:engine` re-runs `npm run build` itself, so this step needs
      # no separate compile — and running the build here is what guarantees the
      # dist/ the suites import is current rather than a stale local artefact.
      - name: Engine regression suite
        shell: pwsh
        run: npm run test:engine

      # -------------------------------------------------------------------------
      # PKG BINARY CACHE.
      #
      # `pkg` downloads a ~100 MB base Node.js binary per (target, platform)
      # from the yao-pkg/pkg-fetch GitHub release on EVERY build, because the
      # runner's home directory is wiped between jobs. This cache is what makes
      # a retry after a transient stall cheap instead of a second full download
      # that can stall again.
      #
      # `~/.pkg-cache` is not a guess — it is pkg-fetch's own default, read
      # straight out of its source: `places.js` does
      # `cachePath = PKG_CACHE_PATH || path.join(os.homedir(), '.pkg-cache')`.
      # `PKG_CACHE_PATH` is deliberately NOT set anywhere in this workflow, so
      # that default is what applies and `~` expands to the runner's real home.
      # If a future change sets PKG_CACHE_PATH, this path must follow it or the
      # cache will silently save nothing while reporting a cache hit.
      #
      # The key pins the pkg-fetch VERSION, read from the INSTALLED package in
      # node_modules rather than from package.json. pkg resolves `node22` to a
      # concrete patch (v22.23.2 via pkg-fetch's patches.json), and that mapping
      # changes on every pkg-fetch upgrade — so the version is the one input that
      # actually determines which binary is cached. Hashing the whole lockfile
      # instead would throw the cache away for unrelated dependency bumps.
      #
      # No `lookup-only` here. pkg only ever READS the cache, so the entry is worth
      # saving exactly once: the first run populates it, and from then on the
      # key matches and actions/cache skips the save itself. `lookup-only: true`
      # would suppress the save on EVERY run and the cache would never be
      # created at all — reporting a permanent, silent miss.
      # -------------------------------------------------------------------------
      - name: Resolve pkg-fetch version
        id: pkgver
        shell: pwsh
        run: |
          $v = (Get-Content 'node_modules/@yao-pkg/pkg-fetch/package.json' -Raw | ConvertFrom-Json).version
          if (-not $v) { throw "Could not read @yao-pkg/pkg-fetch version from node_modules" }
          Write-Host "pkg-fetch version: $v"
          "version=$v" >> "$env:GITHUB_OUTPUT"

      - name: Cache pkg base binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-${{ runner.os }}-${{ steps.pkgver.outputs.version }}
          restore-keys: |
            pkg-${{ runner.os }}-

      # -------------------------------------------------------------------------
      # THE BUILD.
      # -------------------------------------------------------------------------
      - name: Build the portable .exe
        shell: pwsh
        run: npm run package

      # Resolve the built binary ONCE, dynamically, and reuse it for the size
      # check, the checksum and (implicitly) the release. Hardcoding
      # dist\rippa-node.exe in three places meant a single change to
      # scripts/package.mjs broke the build at three different points. This
      # searches the same directories the upload glob covers.
      #
      # IT PICKS THE FILE BY NAME, NOT BY SIZE — and that is now load-bearing.
      # `npm run package` produces TWO executables, rippa-node.exe and its
      # supervisor rippa-watchdog.exe. The old "largest .exe wins" heuristic
      # happened to pick the worker only because it is bigger; it is an accident,
      # not a guarantee, and a watchdog that grows by 30% would silently become the
      # release asset. Worse, publishing the wrong file would leave the fleet
      # downloading a supervisor where a worker belongs.
      #
      # The name is also the ASSET NAME the updater fetches by literal URL lookup,
      # so it must be exact and not merely correct — see RELEASE_ASSET_NAME in
      # src/services/updater.ts.
      - name: Locate and verify the artifact
        id: exe
        shell: pwsh
        run: |
          $wanted = 'rippa-node.exe'
          # Search the packager's output dirs. These ROOTS OVERLAP — '.' walked
          # recursively re-descends into dist\ and build\ — so the same file is
          # matched by more than one iteration and counted twice. That is not a
          # packaging bug; it was an artefact of the search, and the "exactly one
          # copy" assertion below then failed a perfectly good build with
          # "Found 2 copies of rippa-node.exe" and exit code 1, before any
          # checksum or upload could run. Sort-Object -Unique on the resolved
          # path collapses the overlap, so the guard now fires only on genuinely
          # distinct files in different directories, which is what it is for.
          $found = @()
          foreach ($dir in @('dist', 'build', '.')) {
            if (Test-Path $dir) {
              $found += Get-ChildItem -Path $dir -Filter $wanted -File -Recurse -ErrorAction SilentlyContinue
            }
          }
          $found = @($found | Sort-Object -Property FullName -Unique)

          if ($found.Count -eq 0) {
            Write-Error "npm run package produced no $wanted in dist/, build/ or the repo root"
            exit 1
          }
          if ($found.Count -gt 1) {
            Write-Error "Found $($found.Count) copies of $wanted ($($found.FullName -join ', ')). Exactly one must be published, or the release would carry a duplicate asset."
            exit 1
          }
          $exe = $found[0]
          $size = $exe.Length
          Write-Host ("Artifact: {0}" -f $exe.FullName)
          Write-Host ("Artifact size: {0:N1} MB" -f ($size / 1MB))
          if ($size -lt 1MB) {
            Write-Error "Artifact is implausibly small - refusing to publish"
            exit 1
          }
          # Relative, forward-slashed: feeds straight into glob paths and the
          # release `files` list without Windows separators confusing them.
          "path=$($exe.FullName.Replace($PWD.Path + '\', '').Replace('\', '/'))" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      # Ship the checksum with the release so the updater can verify the binary
      # it downloads instead of trusting size + PE magic alone.
      - name: Compute SHA-256
        id: checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ steps.exe.outputs.path }}" -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      # SKIPPED ON A TAG PUSH, deliberately.
      #
      # On a tag, actions/checkout leaves the workspace on a DETACHED HEAD at the
      # tag, so there is no branch to push to — the action fails with a checkout
      # error that gives no hint about its real cause, and because this step sits
      # BEFORE the release, it would abort the run and take the OTA release down
      # with it. A tag build also has nothing to commit back to: the tag itself is
      # the immutable record of the version, and writing package.json afterwards
      # would only re-trigger this workflow.
      - name: Commit the version bump
        if: github.ref_type != 'tag'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ steps.version.outputs.version }}"
          file_pattern: package.json
          # The runner's local `master` is a snapshot from checkout time; any push
          # that lands while this build is running makes the default fast-forward
          # push a NON-FAST-FORWARD rejection and fails "Commit the version bump".
          # `--force-with-lease` lets the bump win the race, while still refusing
          # to clobber a remote that moved to a commit this runner never saw — so
          # a genuine conflicting push is still detected rather than overwritten.
          push_options: '--force-with-lease'
          # Re-fetch before pushing so the lease is evaluated against the newest
          # remote refs. Combined with the option above, this is what turns the
          # race into a resolved push instead of an opaque rejection.
          skip_fetch: false

      # -------------------------------------------------------------------------
      # RELEASE TAG RESOLUTION
      #
      # The release tag is ALWAYS `v1.0.<run_number>` — the same run number the
      # version step just stamped into package.json, so tag, release title,
      # release body and the version compiled into the binary can only ever
      # agree. `github.ref_name` is deliberately never used: on a branch push it
      # is the BRANCH name (not a tag at all), and on an operator tag push it
      # would resurrect the version skew the run number exists to eliminate.
      #
      # The commitish is the pushed SHA, which is always resolvable — that is
      # the entire point: it removes the "release creation failed because
      # master is not a tag" failure. Never a branch name.
      # -------------------------------------------------------------------------
      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          $commitish = "${{ github.sha }}"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commitish=$commitish" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag (commitish: $commitish)"

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          # RUN-NUMBERED TAG, never a fixed rolling tag. Every run mints its
          # own immutable `v1.0.<run_number>`; the fleet's Master polls
          # /releases/latest, which GitHub resolves to the newest release by
          # creation time — and runs create releases in ascending run order,
          # so the newest build is always the answer every node polls.
          tag_name: ${{ steps.release_tag.outputs.tag }}
          # What the release/tag is created from. Never a branch name.
          target_commitish: ${{ steps.release_tag.outputs.commitish }}
          # "Release v1.0.<run_number>" — derived from the TAG output rather
          # than restating the run number, so the title can never drift from
          # the tag it describes.
          name: Release ${{ steps.release_tag.outputs.tag }}
          prerelease: false
          draft: false
          # Auto-generated notes are NOT enabled: they get prepended to `body`
          # and can change shape between runs. The updater parses the version and
          # SHA-256 out of this body, so it must stay byte-stable.
          generate_release_notes: false
          body: |
            Automated build of `rippa-node.exe`.

            rippa-node-version: `${{ steps.version.outputs.version }}`
            SHA-256: `${{ steps.checksum.outputs.sha256 }}`
            build-tag: `${{ steps.release_tag.outputs.tag }}`

            The Master node polls this release hourly and broadcasts the update to
            every paired satellite automatically.
          # EXACT PATHS, NOT `dist/*.exe`.
          #
          # The updater fetches the worker by LITERAL FILENAME lookup
          # (`/releases/latest/download/rippa-node.exe`), and the watchdog ships as a
          # second, separate asset. A `dist/*.exe` glob would publish whatever
          # happened to be in dist/ — including the watchdog, and including a stale
          # exe left by an earlier run — and the asset the fleet requests would then
          # be whatever sorted first. Both files are named explicitly so the release
          # contents are a decision rather than an accident.
          files: |
            dist/rippa-node.exe
            dist/rippa-watchdog.exe
          # `true`, NOT `false`. A missing file must now FAIL the run: the whole
          # point of naming them exactly is that a rename is a broken contract, and
          # `fail_on_unmatched_files: false` would publish a release the fleet
          # cannot download while reporting success — which is precisely how the
          # fleet came to sit on an old binary with nothing to fetch.
          fail_on_unmatched_files: true
        env:
          # Passed explicitly. The action falls back to `github.token`, but the
          # implicit value depends on the repository's default token permissions,
          # so state it to make the 403-on-release impossible to misdiagnose.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------------
      # POST-PUBLISH VERIFICATION.
      #
      # WHY THIS EXISTS. Every setting above is individually permissive enough to
      # let a release silently fail to publish:
      #
      #   * `fail_on_unmatched_files: false` means a renamed binary publishes a
      #     release with NO .exe asset and still reports success — and the node's
      #     `parseLatestRelease` REJECTS an assetless release ("has no .exe asset —
      #     ignoring"), so the fleet sees nothing and the run is green.
      #   * A `contents: write` that is denied at the org level makes the action
      #     403, which this job cannot distinguish from a no-op unless it asks.
      #
      # Both failures present identically from the outside: a green Actions run,
      # a release page, and an OTA update that aborts for no visible reason. So
      # the only honest check is to ASK GITHUB what it actually published and to
      # fail the job when the answer is not what the updater needs.
      #
      # It reads the SAME endpoint the fleet polls (`/releases/latest`) and the
      # same asset fields `parseLatestRelease` requires, so this asserts the
      # updater's contract rather than a proxy for it. A green run here means the
      # next node to poll will find something it can actually install.
      - name: Verify the published release is what the updater needs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = "${{ github.repository }}"
          $expectedVersion = "${{ steps.version.outputs.version }}"
          $expectedSha = "${{ steps.checksum.outputs.sha256 }}"
          # MUST match RELEASE_ASSET_NAME in src/services/updater.ts. The fleet
          # fetches this by literal filename, so an exact match here is the only
          # thing standing between a rename and a fleet-wide 404.
          $expectedAsset = 'rippa-node.exe'

          # `$ErrorActionPreference` covers PowerShell's own errors; a non-2xx HTTP
          # response is not one, so the status is checked explicitly below.
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$repo/releases/latest" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }

          # The endpoint is still /releases/latest — GitHub resolves it to the
          # NEWEST release by creation time, and this run just created the
          # newest one. Assert it carries THIS run's tag: an older release
          # answering here means a stale release is shadowing the newest build,
          # and every node would keep polling it forever.
          $expectedTag = "${{ steps.release_tag.outputs.tag }}"
          if ($release.tag_name -ne $expectedTag) {
            Write-Error "::error::/releases/latest returned tag '$($release.tag_name)', expected '$expectedTag'. A stale release is shadowing the newest build, and the fleet will keep polling it forever."
            exit 1
          }

          # The updater extracts the version from the tag, the NAME or the body —
          # in that order. All three now carry v1.0.<run_number>, but assert the
          # NAME too rather than trusting that it does: it is the fallback an
          # older fleet reads when the tag carries no version.
          if ($release.name -notmatch [regex]::Escape($expectedVersion)) {
            Write-Error "::error::Release name '$($release.name)' does not carry the built version $expectedVersion; the updater will extract a different version and skip the fleet."
            exit 1
          }

          # BY EXACT NAME, NOT "the first .exe". The release also carries
          # rippa-watchdog.exe, so a first-match rule is a coin flip between the
          # worker and its supervisor — and the old check here actively FAILED a
          # correct release for having two .exe assets. Naming both removes the
          # ambiguity instead of banning it.
          $asset = $release.assets | Where-Object { $_.name -eq $expectedAsset } | Select-Object -First 1
          if (-not $asset) {
            Write-Error "::error::Release '$($release.tag_name)' has no asset named exactly '$expectedAsset' (found: $(@($release.assets).name -join ', ')). The updater requests /releases/latest/download/$expectedAsset, which is a literal filename lookup and 404s on any other name."
            exit 1
          }

          # The watchdog ships alongside the worker, so both must be present and
          # neither may be duplicated. Two assets with the same name make which one
          # a node downloads arbitrary.
          $dupes = @($release.assets | Where-Object { $_.name -eq $expectedAsset })
          if ($dupes.Count -gt 1) {
            Write-Error "::error::Release has $($dupes.Count) assets named '$expectedAsset'; which one a node downloads would be arbitrary."
            exit 1
          }

          $watchdogAsset = $release.assets | Where-Object { $_.name -eq 'rippa-watchdog.exe' } | Select-Object -First 1
          if (-not $watchdogAsset) {
            Write-Error "::error::Release has no rippa-watchdog.exe. A node installing this release would have a worker with no supervisor, so restarts would go back to acting as shutdowns."
            exit 1
          }

          # A zero-byte or placeholder asset passes every check above and still
          # leaves the fleet with a binary it cannot run.
          if ($asset.size -lt 1MB) {
            Write-Error "::error::Published asset $($asset.name) is only $($asset.size) bytes. The Locate step refuses to publish under 1MB, so this is a truncated upload rather than a real binary."
            exit 1
          }
          if ($watchdogAsset.size -lt 1MB) {
            Write-Error "::error::Published asset $($watchdogAsset.name) is only $($watchdogAsset.size) bytes; it cannot be a real supervisor."
            exit 1
          }

          if ($release.body -notmatch [regex]::Escape($expectedSha)) {
            Write-Error "::error::Release body does not carry the built SHA-256, so the updater cannot verify what it downloads."
            exit 1
          }

          Write-Host "Verified: $expectedTag -> $($release.name)"
          Write-Host "  worker   $($asset.name) ($([math]::Round($asset.size/1MB,1)) MB), SHA recorded"
          Write-Host "  watchdog $($watchdogAsset.name) ($([math]::Round($watchdogAsset.size/1MB,1)) MB)"

      # DIAGNOSTIC. `npm run package` writes dist/rippa-node.exe (see
      # scripts/package.mjs), but when packaging fails upstream the upload step
      # below reports the misleading "No files were found with the provided
      # path" — because it has `if: always()`, it runs even after the real step
      # already failed, hiding the actual error. Dumping the tree makes the true
      # cause (empty dist/, missing build/, exe under a different name) visible
      # in the log. bash, not pwsh: this job's default shell is PowerShell,
      # where `ls -la` is not valid syntax; Git Bash ships on windows-latest.
      - name: List build outputs
        shell: bash
        run: |
          ls -la
          ls -la dist || true
          ls -la build || true

      # The release is a distribution channel; the artifact is the safety net.
      # `if: always()` is deliberate: a failed or skipped release publish must
      # never cost us the built exe, which is expensive to rebuild and is the
      # only copy of that exact build.
      - name: Upload the portable .exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rippa-node-windows
          # STATIC globs, never a step output. The Locate step above exits 1 when
          # pkg produces nothing, so this `if: always()` step would otherwise run
          # with an empty `path` and upload-artifact@v4 aborts the step with
          # "Input required and not supplied: path" — masking the real pkg error.
          # Glob rather than the literal dist/rippa-node.exe: any *.exe the
          # packager emits is still the artifact we want, even if the output
          # path in scripts/package.mjs is ever changed.
          path: |
            dist/*.exe
            build/*.exe
            *.exe
          # `warn`, not `error`: the exe build is the expensive, irreplaceable
          # output. A path mismatch is a packaging bug to fix in the next
          # commit — it must not terminate the rest of the workflow.
          if-no-files-found: warn
          retention-days: 30


  # ===========================================================================
  # ANDROID APK JOB — RE-ENABLED.
  #
  # It was deleted on 2026-10-01 after failing with "Worker bundling failed —
  # the worker must not depend on Node builtins". That was a real architectural
  # fault, not a YAML mistake, and it has now actually been fixed:
  #
  #   * `src/satellite/storage-provider.ts` puts persistence behind a
  #     StorageProvider interface, with better-sqlite3 kept as the DESKTOP
  #     implementation only (`storage-desktop.ts`).
  #   * `src/satellite/mobile-worker.ts` is the browser-safe satellite core and
  #     IS part of the WebView bundle (re-exported from `mobile/src/worker.ts`).
  #   * `scripts/build-mobile-worker.mjs` bundles for the browser and remaps the
  #     desktop provider onto `storage-desktop.browser.ts` via an esbuild plugin.
  #
  # WHY THE PLUGIN IS NECESSARY. Guarding the desktop branch with a runtime
  # check is NOT sufficient: esbuild resolves and parses a dynamically imported
  # module during its scan phase, BEFORE dead-code elimination, so better-sqlite3
  # was still pulled in and the build died on `Could not resolve "path"`.
  # `--alias:` cannot fix it either — esbuild only accepts bare package
  # specifiers there, never the relative `./storage-desktop.js` that is imported.
  # A resolve plugin is the only mechanism that keeps the desktop module out of
  # the browser graph, and `npm run test:mobile:bundle` now proves it by
  # evaluating the emitted bundle in a WebView-shaped context on every run.
  #
  # INDEPENDENCE. This job has no `needs:` on the Windows job and vice versa, so
  # an Android-only failure can never block the fleet's .exe release.
  # ===========================================================================
  build-apk:
    name: Build rippa-satellite.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 17 is what Capacitor 6 / AGP 8.x / Gradle 8 target. The build fails
      # cryptically on 11, so this pin is load-bearing, not cosmetic.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # NO setup-android step on purpose. The ubuntu-latest image already ships
      # the Android SDK and exports ANDROID_HOME / ANDROID_SDK_ROOT, which
      # Capacitor's Gradle build resolves from. android-actions/setup-android
      # only added a slow SDK re-download and another failure point. If Gradle
      # ever needs a missing component, install it with sdkmanager explicitly
      # rather than reintroducing the action.

      # Gradle's own cache. Without it every run re-downloads the Android
      # toolchain and dependency graph from scratch, which is most of the job.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ runner.os }}-${{ hashFiles('mobile/android/**/build.gradle') }}
          restore-keys: |
            gradle-apk-${{ runner.os }}-

      # `npm ci` needs a lockfile in sync with package.json; fall back so a
      # lockfile mismatch can never hard-fail the release pipeline.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # -------------------------------------------------------------------------
      # THE BUNDLE IS VERIFIED BEFORE GRADLE IS SPENT.
      #
      # This step needs no Android SDK and takes about a second, and it is the
      # check that would have caught the original failure in seconds instead of
      # after a multi-minute Gradle run. It builds the worker, asserts it holds
      # no better-sqlite3 / node builtins, then evaluates the bundle in a
      # WebView-shaped context.
      # -------------------------------------------------------------------------
      - name: Verify the mobile worker bundle is WebView-safe
        run: npm run test:mobile:bundle

      # Compiles web assets, stages mobile/www/, generates mobile/android/,
      # applies the manifest overlay and runs Gradle assembleDebug. The script
      # copies the result to ./rippa-satellite.apk at the workspace root.
      - name: Build the APK
        run: npm run build:apk

      # NORMALISES THE APK ONTO ONE PATH, whichever variant produced it.
      #
      # scripts/package-apk.mjs copies Gradle's output to ./rippa-satellite.apk at
      # the root, so the upload step below can use a static path. That contract was
      # silently load-bearing: whenever the build failed BEFORE the copy — a
      # version assertion, a Gradle error, a stale overlay — the run died and the
      # `if: always()` upload then reported the misleading
      # "No files were found with the provided path: rippa-satellite.apk", naming a
      # file that was never really in question and hiding the step that actually
      # failed.
      #
      # So the search is done here, explicitly, against Gradle's REAL output tree,
      # and whatever is found is copied to the stable root name before upload. The
      # upload then has exactly one thing to look for, and this step is the only
      # place that decides whether an APK exists at all.
      #
      # The candidates are listed in preference order (release, then debug) rather
      # than taken from `find | head -n 1`, because head on an arbitrary directory
      # walk is not a decision: it can publish a `-unsigned` or a stale split APK.
      # `|| true` keeps `set -e` from killing the step before the explicit error
      # below can explain what happened.
      - name: Locate the APK
        id: apk
        run: |
          set -euo pipefail
          OUT=mobile/android/app/build/outputs/apk
          APK=""
          for CANDIDATE in \
            "$OUT/release/app-release.apk" \
            "$OUT/debug/app-debug.apk" \
            rippa-satellite.apk
          do
            if [ -f "$CANDIDATE" ]; then
              APK="$CANDIDATE"
              break
            fi
          done
          # Fall back to a sweep of the output tree for any variant not listed
          # above (e.g. a per-flavor directory), ignoring the obvious non-shipping
          # artefacts.
          if [ -z "$APK" ]; then
            APK=$(find "$OUT" -name '*.apk' ! -name '*unsigned*' 2>/dev/null | sort | head -n 1 || true)
          fi
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "::error::Gradle produced no APK. Looked in $OUT and the workspace root."
            ls -laR "$OUT" 2>/dev/null || true
            exit 1
          fi
          # Copy onto the stable name the upload step (and every operator's
          # `adb install -r rippa-satellite.apk`) expects.
          cp "$APK" rippa-satellite.apk
          echo "Found $APK -> rippa-satellite.apk ($(du -h rippa-satellite.apk | cut -f1))"
          echo "path=rippa-satellite.apk" >> "$GITHUB_OUTPUT"

      # Asserts the foreground-service configuration AND the in-app updater's
      # permissions really made it into the binary. A silently-missing WAKE_LOCK is
      # the exact failure that makes a tablet stop at midnight, and a missing
      # REQUEST_INSTALL_PACKAGES or FileProvider is the exact failure that makes the
      # Update button do nothing — both are invisible until a human is holding the
      # device. Skips cleanly when aapt2 is absent rather than failing on a missing
      # tool.
      #
      # THE LAST THREE NEEDLES COVER THE PLATFORM-INTEGRATION FEATURES, AND EACH ONE
      # SHIPS BROKEN WHEN IT IS MISSING:
      #
      #   RippaNodeTileService          the class is only half the tile — without its
      #                                 <service> declaration it compiles, installs
      #                                 and simply never appears in the shade.
      #   BIND_QUICK_SETTINGS_TILE      the guard Android checks before listing a
      #                                 tile at all; absent means silently unlisted.
      #   RECEIVE_BOOT_COMPLETED        without it the node does not come back after a
      #                                 reboot, which is indistinguishable from the
      #                                 node having stopped voluntarily.
      #
      # Asserting these against the BUILT APK rather than the source overlay is the
      # whole point: the overlay is copied in at package time and a merge can drop a
      # declaration without any tool in the chain complaining.
      - name: Verify the APK manifest
        run: |
          set -euo pipefail
          # The package ID is the OTA contract: the satellite's in-app updater
          # (MobileBridge.assertItIsThisApp()) deletes any APK whose package is
          # not com.rippaadventures.node, and Android itself refuses an update
          # that changes the ID. A build stamped com.rippaadventures.app (the
          # consumer app ID) downloads fine and aborts install with
          # "Refusing to install" — so the ID is asserted here against the
          # BUILT binary, not just the source config.
          EXPECTED_PKG="com.rippaadventures.node"
          echo "Expected package: $EXPECTED_PKG"
          echo "Checking generated build config ..."
          if ! grep -q "applicationId \"$EXPECTED_PKG\"" mobile/android/app/build.gradle; then
            echo "::error::app/build.gradle does not set applicationId \"$EXPECTED_PKG\""
            grep -n "applicationId" mobile/android/app/build.gradle || true
            exit 1
          fi
          if ! grep -q "namespace \"$EXPECTED_PKG\"" mobile/android/app/build.gradle; then
            echo "::error::app/build.gradle does not set namespace \"$EXPECTED_PKG\""
            grep -n "namespace" mobile/android/app/build.gradle || true
            exit 1
          fi
          for FORBIDDEN in com.rippaadventures.app com.codelink.app com.getcapacitor.app; do
            if grep -rq "$FORBIDDEN" mobile/android/app/build.gradle mobile/capacitor.config.json mobile/android/app/src/main/AndroidManifest.xml 2>/dev/null; then
              echo "::error::forbidden package ID $FORBIDDEN found in the Android build config"
              grep -rn "$FORBIDDEN" mobile/android/app/build.gradle mobile/capacitor.config.json mobile/android/app/src/main/AndroidManifest.xml || true
              exit 1
            fi
          done
          echo "ok: build config carries $EXPECTED_PKG and no forbidden ID"
          AAPT=$(ls "${ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | head -n 1 || true)
          if [ -z "$AAPT" ]; then
            echo "::warning::aapt2 not found; skipping manifest verification"
            exit 0
          fi
          DUMP="$("$AAPT" dump xmltree --file AndroidManifest.xml "${{ steps.apk.outputs.path }}" | tr -d '\r')"
          if ! grep -q "com.rippaadventures.node" <<<"$DUMP"; then
            echo "::error::built APK manifest does not declare package com.rippaadventures.node"
            exit 1
          fi
          echo "ok: built APK declares com.rippaadventures.node"
          for NEEDLE in WAKE_LOCK FOREGROUND_SERVICE RippaNodeService REQUEST_INSTALL_PACKAGES FileProvider RippaNodeTileService BIND_QUICK_SETTINGS_TILE RECEIVE_BOOT_COMPLETED REQUEST_IGNORE_BATTERY_OPTIMIZATIONS; do
            if ! grep -q "$NEEDLE" <<<"$DUMP"; then
              echo "::error::APK manifest is missing $NEEDLE"
              exit 1
            fi
            echo "ok: $NEEDLE present"
          done

      # THE DELIVERABLE. This is what a tablet operator downloads and sideloads,
      # so it is a first-class artifact with a stable name rather than something
      # buried in release assets.
      - name: Upload rippa-satellite.apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rippa-satellite-apk
          # Static paths, never a step output: the Locate step exits 1 when Gradle
          # emits nothing, and `if: always()` would then pass an EMPTY output,
          # which upload-artifact@v4 rejects with "Input required and not
          # supplied: path" — masking the real Gradle failure.
          #
          # The root copy the Locate step normalises onto is listed FIRST, and the
          # Gradle output tree is included as a backstop so a rename or a variant
          # that skipped normalisation still yields the artifact rather than a
          # misleading "No files were found with the provided path".
          path: |
            rippa-satellite.apk
            mobile/android/app/build/outputs/apk/**/*.apk
          # `error`, not `warn`: the APK is the entire purpose of this job, so a
          # missing artifact must surface as a red run rather than a green check
          # that produced nothing.
          if-no-files-found: error
          retention-days: 30

      # DIAGNOSTIC. A Gradle failure deep in the Android build is hard to read
      # without knowing what was actually staged.
      - name: List build outputs
        if: always()
        run: |
          ls -la
          ls -la mobile/www || true
          ls -laR mobile/android/app/build/outputs/apk 2>/dev/null || true

